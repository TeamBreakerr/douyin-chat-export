name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # 与 Dockerfile 运行时一致
          cache: pip
      - name: Install deps
        # 只装 pip 包，不装 playwright 浏览器：测试是离线特征测试，不启浏览器
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Stub frontend dist
        # backend.main 只在 frontend/dist 存在时才注册 SPA 路由（/、/favicon.svg、
        # /{full_path}）。路由契约测试要断言完整路由表，所以造个空壳让它们注册；
        # 内容无所谓，契约测试只枚举路由不请求它们。
        run: mkdir -p frontend/dist/assets && touch frontend/dist/index.html
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"              # 与 Dockerfile frontend-builder 一致
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test --if-present
      - run: npm run build
